# Checks of every pull request and every push to main. bin/pr waits for them before it merges.
# The Codex review is not here: it runs locally (AGENTS.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Build check and Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install the pinned dev dependencies
        run: npm ci
      - name: desktop/plugin.js and studio-core.mjs are up to date
        run: node scripts/build.mjs --check
      - name: UI and engine tests (fail, never skip, when a dependency is missing)
        run: npm test
      - name: Review-script tests
        run: npm run test:bin

  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install the declared test dependencies
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: pytest -q tests

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" # gitleaks_<version>_linux_x64.tar.gz
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the scan reads every commit of the range below
      # Not gitleaks/gitleaks-action: it scans from the first to the last of the first 30 commits the PR API lists, with
      # `--no-merges --first-parent`, so a secret in commit 31 or in a merged side branch would pass.
      - name: Install gitleaks (pinned version, checked against its published checksum)
        run: |
          set -eu
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan every commit the pull request or push adds
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "${PUSH_BEFORE#0000000}" != "$PUSH_BEFORE" ] || ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="--all" # a new branch or a force push: the old tip is not a commit here, scan the whole history
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          # git log -p shows no patch for a merge commit unless asked: --diff-merges=first-parent covers what a merge
          # (a conflict resolution included) brings in, while the walk still visits every commit of the range
          ./gitleaks detect --redact -v --exit-code 2 --log-opts="--diff-merges=first-parent $range"
